name: Full Process CI

on:
  push:
    branches-ignore:
      - "dependabot/**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}
    strategy:
      matrix:
        php: [8.2]
        symfony: [7.1]

    steps:
      - uses: actions/checkout@v4

      - name: Composer validate
        run: composer validate

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: intl, mbstring, opache, pdo_sqlite, apcu, pcov
          tools: symfony
          coverage: pcov

      - name: Install composer dependencies
        run: composer install --no-interaction

      - name: Check security issues
        run: symfony security:check

      - name: Check ECS review
        run: vendor/bin/ecs check src

      - name: Run Unit Tests
        run: php bin/phpunit --testsuite=unit --coverage-clover coverage/cov-functional.xml

      - name: Run Functional Tests
        run: php bin/phpunit --testsuite=functional --coverage-clover coverage/cov-functional.xml
        